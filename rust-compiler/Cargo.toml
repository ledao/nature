[package]
name = "nrc"
version = "0.1.0"
edition = "2021"
authors = ["Nature Compiler Team"]
description = "Rust implementation of Nature programming language compiler"
license = "Apache-2.0"
repository = "https://github.com/nature-lang/nature"
keywords = ["compiler", "programming-language", "nature"]
categories = ["development-tools::build-utils"]

[dependencies]
# LLVM bindings
inkwell = { version = "0.4", features = ["llvm15-0", "llvm15-0-prefer-dynamic"] }
llvm-sys = { version = "150", features = ["prefer-dynamic"] }

# Parsing and lexing
logos = "0.13"
nom = "7.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Collections and utilities
indexmap = "2.0"
smallvec = "1.11"
once_cell = "1.19"

# String handling
regex = "1.10"
unicode-normalization = "0.1"

# File I/O
walkdir = "2.4"
glob = "0.3"

# Logging
log = "0.4"
env_logger = "0.10"

# Parallel processing
rayon = "1.8"

# CLI
clap = { version = "4.4", features = ["derive"] }

[build-dependencies]
# No build dependencies needed for Rust runtime

[dev-dependencies]
# Testing
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

# Benchmarking
#criterion = "0.5"

[[bench]]
name = "compiler_benchmarks"
harness = false

[features]
default = []
llvm-backend = ["inkwell/llvm15-0"]
cranelift-backend = []  # Future alternative backend
debug = []  # Debug features
